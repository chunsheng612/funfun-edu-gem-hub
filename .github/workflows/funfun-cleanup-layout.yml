name: Complete repository layout cleanup

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Finish layout cleanup
        shell: bash
        run: |
          set -euo pipefail

          [ -e gems/gems_quick_index.md ] && mv -- gems/gems_quick_index.md references/
          rm -f validate-skill.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete repository layout cleanup"
          git push
