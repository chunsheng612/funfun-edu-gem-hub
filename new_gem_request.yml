name: 提案新增 Gem (New Gem Proposal)
description: 建議在 Hub 中收錄新的 Gemini Gem
title: "[新 Gem 提案]: "
labels: ["enhancement", "new-gem"]
body:
  - type: input
    id: gem_name
    attributes:
      label: Gem 名稱
      placeholder: 例如：FunFun.AI-自然探究實驗設計師
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: 所屬領域分類
      options:
        - 特殊教育與個別化支持
        - 教學設計與素養教案
        - 評量、命題與作業批改
        - 語文學習與閱讀引導
        - 班級經營與親師溝通
        - 視覺設計與教育繪圖
        - 遊戲化學習與教具
        - 行政公文與專案計畫
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 說明 (Description)
      placeholder: 請簡述此 Gem 的用途與使用情境
    validations:
      required: true
  - type: textarea
    id: instructions
    attributes:
      label: 系統提示詞 (System Instructions)
      placeholder: 請貼上該 Gem 的完整系統提示詞
    validations:
      required: true
